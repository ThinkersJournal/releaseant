name: Runner tests (self-hosted)

# Runs the real-crane check (tests/crane_runner.rs) on a GitHub-hosted ubuntu runner (Docker is preinstalled
# there; crane is installed pinned below) and the real-GitHub check of GhForge (tests/forge_runner.rs) on a
# self-hosted runner, both behind feature `runner-tests`. See docs/RUNNER-TESTS.md.
#
# SECURITY (public repo, CIRESNAVE-EXPECTATIONS 5.1h): this job runs on a self-hosted machine, so it must
# never run code from a fork. Triggers are limited to push to main, a schedule and manual dispatch, all
# of which run only code already on `main` or that a maintainer chose to dispatch. There is
# deliberately NO `pull_request` trigger, and the job names no secret.
#
# The crane job runs on a hosted runner and needs no switch. The forge job (self-hosted) stays INERT until the
# repository variable RUNNER_TESTS_ENABLED is 'true' (set only after a runner is registered for it).
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "probe the WSL runner for the forge job (prints gh auth status, reads the rehearsal repo)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  crane:
    name: real crane against registry:2
    # GitHub-hosted: no self-hosted machine, no secret, no Docker-group access to anyone's computer.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      # crane 0.22.1 is the version the measurements used. The sha256 is the release's checksums.txt line for
      # go-containerregistry_Linux_x86_64.tar.gz and equals the hash of the file downloaded when this was written.
      - name: Install crane 0.22.1 (pinned)
        shell: bash
        run: |
          set -euo pipefail
          f=go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSL -o "$f" "https://github.com/google/go-containerregistry/releases/download/v0.22.1/$f"
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/crane"
          tar -xzf "$f" -C "$RUNNER_TEMP/crane" crane
          echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/crane/crane" version
          docker --version
      # Fails if the test fails, if Docker or crane is missing (the test panics, it does not skip), or
      # if it did not run exactly one test: a run that passes zero tests is a failure.
      - name: cargo test (runner-tests)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --features runner-tests --test crane_runner -- --nocapture 2>&1 | tee runner-test.log
          grep -q "test result: ok. 1 passed; 0 failed" runner-test.log \
            || { echo "::error::the runner test did not run and pass exactly once"; exit 1; }
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-test-log
          path: runner-test.log
          if-no-files-found: error

  forge:
    name: real GhForge against the private rehearsal repository
    if: vars.RUNNER_TESTS_ENABLED == 'true'
    # Uses the `gh` already signed in on the runner machine (write access to
    # ciresnave-bot/releaseant-artifact-rehearsal, or $RELEASEANT_FORGE_REPO set on the runner);
    # this file names no secret. Same labels as the crane job (the PM's to set).
    runs-on: [self-hosted, windows, releaseant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      # Same rule as the crane job: exactly one test must have run and passed (the test fails, it
      # does not skip, when gh is missing or refused). It leaves 0 releases and 0 tags behind.
      - name: cargo test (runner-tests)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --features runner-tests --test forge_runner -- --nocapture 2>&1 | tee forge-test.log
          grep -q "test result: ok. 1 passed; 0 failed" forge-test.log             || { echo "::error::the forge test did not run and pass exactly once"; exit 1; }
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-test-log
          path: forge-test.log
          if-no-files-found: error

  # TEMPORARY (PM 2026-11-12): does the WSL runner's gh login reach the rehearsal repository? Dispatch only; reads, never writes.
  forge-probe:
    name: probe the WSL runner
    if: github.event_name == 'workflow_dispatch' && inputs.probe
    runs-on: [self-hosted, Linux, X64, wsl]
    timeout-minutes: 5
    steps:
      - name: whoami and gh auth status
        shell: bash
        run: |
          id -un
          gh --version | head -1
          gh auth status 2>&1 || true
      - name: read-only look at the rehearsal repository
        shell: bash
        run: |
          gh api repos/ciresnave-bot/releaseant-artifact-rehearsal --jq '{full_name, private, permissions}' 2>&1 || true
