[package]
name = "releaseant"
version = "0.0.70"
edition = "2024"
rust-version = "1.88"
description = "Ordered, verified, resumable publishing of Rust crates and workspaces to crates.io, with read-back."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/releaseant"
readme = "README.md"
keywords = ["ant", "releaseant"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
# Tests that need Docker and crane. Type-checked on every PR (clippy and doc build with all features),
# RUN by .github/workflows/runner-tests.yml on the self-hosted runner, never #[ignore]d. See
# docs/RUNNER-TESTS.md. Nothing in the library depends on it.
runner-tests = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default", "gzip"] }

[dev-dependencies]
tempfile = "3.27.0"
